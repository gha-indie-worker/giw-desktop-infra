name: giw-desktop-lease
on:
  pull_request:
    paths:
      - 'tools/desktop_control_lease.py'
      - 'tests/test_desktop_control_lease.py'
      - '.github/workflows/giw-desktop-lease.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run exact checked-out source regression
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_desktop_control_lease.py -v
