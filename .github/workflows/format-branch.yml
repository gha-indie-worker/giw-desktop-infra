name: Format infra validator branch

on:
  push:
    branches:
      - feat/desktop-control-plane

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/desktop-control-plane
          persist-credentials: true
      - name: Apply rustfmt
        working-directory: tools/validator
        run: cargo fmt --all
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/validator
          git commit -m 'style: apply cargo fmt to infra validator'
          git push origin HEAD:feat/desktop-control-plane
