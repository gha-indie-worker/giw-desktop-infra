name: oreslang-pr68-gc-validation

on:
  push:
    branches: ["ci/oreslang-pr68-gc"]

permissions:
  contents: read

concurrency:
  group: oreslang-pr68-gc-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out public validation snapshot
        uses: actions/checkout@v4
        with:
          repository: ORESoftware/ores-comparisons
          ref: ci/oreslang-pr68-gc-validation
          path: validation
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.3'
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: GC and actor-isolation focused tests
        working-directory: validation/_ci/oreslang-pr57-full
        run: >-
          mvn -B -ntp
          -Dtest=GarbageCollectionHardeningTest,ActorRuntimeTest,ActorTransportHardeningTest,PrivateActorIsolationTest,SharedPrivateActorIsolationProofTest,OreslangActorIsolationExampleTest
          test
      - name: GC demo contract
        working-directory: validation/_ci/oreslang-pr57-full
        run: |
          output="$(mvn -B -ntp -e -DskipTests exec:java -Dexec.args=examples/demo-gc-contract.ores 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "gc-contract-ok" <<<"$output"
      - name: Full test suite
        working-directory: validation/_ci/oreslang-pr57-full
        run: mvn -B -ntp test
