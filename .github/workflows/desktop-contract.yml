name: desktop-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install declared Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.90.0"
          components: rustfmt, clippy
      - name: Format
        working-directory: tools/giw-desktop-tool
        run: cargo +1.90.0 fmt --all -- --check
      - name: Clippy
        working-directory: tools/giw-desktop-tool
        run: cargo +1.90.0 clippy --all-targets -- -D warnings
      - name: Test
        working-directory: tools/giw-desktop-tool
        run: cargo +1.90.0 test --all-targets
      - name: Validate desktop appliance and generation contract
        working-directory: tools/giw-desktop-tool
        run: cargo +1.90.0 run --quiet
