schema_version = 1

[daemon]
listen_addr = "127.0.0.1:8770"
token_file = "~/.indiebuild/daemon/token"

[execution]
backend = "scintilla_desktop_daemon"
scintilla_url = "http://127.0.0.1:8765"
scintilla_token_file = "~/.scintilla/daemon/token"
ephemeral_per_job = true
reuse_workspace = false
max_parallel_jobs = 4

[cloudflare]
enabled = false
managed_by = "scintilla"
hostname = ""

[power]
keep_awake = false

[runner]
workspace_root = "~/.indiebuild/workspaces"
max_parallel_jobs = 4
default_timeout_secs = 3600
max_timeout_secs = 21600

# GIW owns workflow/job intent and GitHub-compatible execution semantics.
# It does not duplicate Scintilla worker lifecycle/isolation. Local jobs are
# projected as typed ephemeral jobs to the Scintilla desktop daemon, which
# remains the machine-level process/container authority.
